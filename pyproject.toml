[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pinsheet-server"
version = "0.8.0"
requires-python = ">=3.11"

dependencies = [
    # Upper bounds cap silent major-version upgrades (issue #79, CWE-1104);
    # requirements.lock provides the fully-pinned, hash-verified build.
    "flask>=3.0,<4.0",
    "werkzeug>=3.0,<4.0",
    "waitress>=2.0,<4.0",
    "bcrypt>=4.0,<6.0",
    "flask-login>=0.6,<0.7",
    "flask-limiter>=3.0,<5.0",
    "flask-wtf>=1.2,<2.0",
    "flask-talisman>=1.1,<2.0",
]

[project.optional-dependencies]
# pip-tools regenerates requirements.lock (issue #79):
#   pip-compile --generate-hashes --strip-extras --output-file=requirements.lock pyproject.toml
dev = ["pytest>=8", "pytest-flask>=1", "pytest-cov>=5", "pip-tools>=7"]

[tool.setuptools.packages.find]
include = ["source", "source.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["source"]
omit = ["source/web/static/*", "source/web/templates/*"]

[tool.coverage.report]
fail_under = 85