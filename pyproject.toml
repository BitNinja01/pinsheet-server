[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pinsheet-server"
version = "0.8.0"
requires-python = ">=3.11"

dependencies = [
    # Upper bounds cap silent major-version upgrades (issue #79, CWE-1104);
    # requirements.lock provides the fully-pinned, hash-verified build.
    "flask>=3.0,<4.0",
    "werkzeug>=3.0,<4.0",
    "waitress>=2.0,<4.0",
    "bcrypt>=4.0,<6.0",
    "flask-login>=0.6,<0.7",
    "flask-limiter>=3.0,<5.0",
    "flask-wtf>=1.2,<2.0",
    "flask-talisman>=1.1,<2.0",
    # --- /api/v1 (issue #50) additions ---
    # apiflask: OpenAPI 3.1 + Swagger/Redoc for the v1 surface. Upper-bounded
    # because apiflask has shipped breaking majors recently on a C4 surface.
    # Supply-chain note: apiflask 3.x pulls marshmallow + flask-marshmallow +
    # apispec + webargs (the schema stack v1 actually uses) AND pydantic[email]
    # + flask-httpauth as inert transitive deps. v1 code is marshmallow-only;
    # flask-httpauth must not be imported by any v1 module (auth stays on the
    # existing Flask-Login request_loader).
    "apiflask>=3.1.1,<4.0",
    # flask-cors: CVE floor, not a style choice. >=6.0.0 closes
    # CVE-2024-6221/6839/6844/6866 (CORS bypass / private-network exposure).
    "flask-cors>=6.0.0,<7.0",
    # opentelemetry-api/-sdk: no-op tracing scaffolding, OTEL_ENABLED gated, no
    # exporter configured. Exact-pinned because API and SDK must move in
    # lockstep per the OTel Python project's own policy.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
]

[project.optional-dependencies]
# pip-tools regenerates requirements.lock (issue #79):
#   pip-compile --generate-hashes --strip-extras --output-file=requirements.lock pyproject.toml
dev = ["pytest>=8", "pytest-flask>=1", "pytest-cov>=5", "pip-tools>=7", "hypothesis>=6"]

[tool.setuptools.packages.find]
include = ["source", "source.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["source"]
omit = ["source/web/static/*", "source/web/templates/*"]

[tool.coverage.report]
fail_under = 85